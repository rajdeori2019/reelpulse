name: Daily snapshot

# Velocity needs one measurement. Acceleration needs two.
#
# This job exists solely to take that second measurement: it records view counts
# once a day so that Monday's report can tell "still climbing" apart from
# "peaked on Tuesday and coasting". Skip this workflow and the pipeline still
# works, but the acceleration component sits at neutral forever and you lose
# the single best early-warning signal in the whole model.
#
# Cost: roughly 2,400 of your 10,000 daily YouTube quota units.

on:
  schedule:
    - cron: "0 7 * * *"        # every day 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/reelpulse.db
          key: reelpulse-db-${{ github.run_id }}
          restore-keys: reelpulse-db-

      - name: Load the rate-limit ledger
        # The database lives in a cache GitHub evicts after 7 days — the same
        # length as Instagram's hashtag window. This committed file is what
        # stops an eviction from silently resetting every budget to full.
        run: python -m reelpulse ledger import

      - name: Snapshot
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m reelpulse collect

      - name: Save the rate-limit ledger
        if: always()
        # always(), because a run that failed part-way still spent what it
        # spent. Losing that record is how the next run overspends.
        run: python -m reelpulse ledger export

      - name: Persist the database
        run: |
          git config user.name  "reelpulse-bot"
          git config user.email "actions@github.com"
          git add -A data
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push
